version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: agent_chaos_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  agent-lab:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agent_chaos_platform
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - .:/app
    command: streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  ollama_data:
